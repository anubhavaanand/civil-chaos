name: "🐛 Bug Report"
description: Report a defect on the site, CMS, or booking flow
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us keep the trails safe. Please fill in as much detail as you can.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend (apps/web)
        - CMS / API (apps/cms)
        - Booking flow
        - Interactive map
        - 3D terrain viewer
        - Deployment / infra
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen instead.
      placeholder: When I clicked "Reserve spots" on /treks/kedarkantha, the modal opened but batches were empty…
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1. Go to '…'
        2. Click on '…'
        3. Observe '…'
  - type: input
    id: url
    attributes:
      label: Affected URL
      placeholder: "https://civil-chaos.pages.dev/treks/…"
  - type: dropdown
    id: device
    attributes:
      label: Device / browser
      options:
        - Desktop Chrome
        - Desktop Firefox
        - Desktop Safari / Edge
        - Mobile Android Chrome
        - Mobile iOS Safari
        - Other (describe above)
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or console output
      render: shell
