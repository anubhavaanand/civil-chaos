name: "✨ Feature Request"
description: Propose a new capability or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Product principles live in `AGENTS.md` — check the phase scope and guardrails before proposing.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve for trekkers or the agency?
      placeholder: Guides spend minutes re-entering batch details because…
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested solution
      description: How should it work? Which Strapi content types or pages are involved?
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Phase alignment
      description: Where does this fit in the roadmap (see docs/PRD.md)?
      options:
        - Phase 1 (current scope)
        - Phase 2 (payments, auth — reserved)
        - Backlog / needs triage
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
